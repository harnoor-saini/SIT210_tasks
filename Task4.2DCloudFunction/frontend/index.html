
<!DOCTYPE html>
<html>
<head>
    <title>Smart Home</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 45px 20px 25px;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            color: #aaa;
            margin-top: 10px;
        }

        .rooms {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 25px;
        }

        .room {
            background: #111;
            border: 1px solid #333;
            width: 260px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .room h2 {
            margin-bottom: 25px;
            font-size: 20px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 55px;
            height: 30px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #444;
            border-radius: 30px;
            transition: 0.2s;
        }

        .slider:before {
            content: "";
            position: absolute;
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        input:checked + .slider {
            background: #2478d4;
        }

        input:checked + .slider:before {
            transform: translateX(25px);
        }

        #status {
            text-align: center;
            margin: 30px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>Smart Home</h1>
        <p>Remote Light Control</p>
    </header>

    <div class="rooms">

        <div class="room">
            <h2>Living Room</h2>

            <label class="switch">
                <input type="checkbox"
                       onchange="controlLight('living room', this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="room">
            <h2>Bathroom</h2>

            <label class="switch">
                <input type="checkbox"
                       onchange="controlLight('bathroom', this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="room">
            <h2>Closet</h2>

            <label class="switch">
                <input type="checkbox"
                       onchange="controlLight('closet', this.checked)">
                <span class="slider"></span>
            </label>
        </div>

    </div>

    <div id="status">
        Ready to control lights
    </div>

    <script src="script.js"></script>

</body>
</html>
